name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - name: WebDriverAgentをチェックアウト
      uses: actions/checkout@v4
      with:
        repository: appium/WebDriverAgent
    - name: Xcodeのバージョンを切り替え
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    - name: 依存関係のインストール
      run: brew install xcbeautify
    - name: ビルド
      run: |
        xcodebuild build-for-testing \
          -project WebDriverAgent.xcodeproj \
          -scheme WebDriverAgentRunner \
          -destination "generic/platform=iOS" \
          -derivedDataPath ./DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    - name: スタブDylibを削除
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        python3 << 'PYEOF'
        import os, struct
        app = "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        for root, dirs, files in os.walk(app):
            for name in files:
                path = os.path.join(root, name)
                try:
                    with open(path, 'rb') as f:
                        data = f.read(16)
                    if len(data) >= 16:
                        magic = struct.unpack_from('<I', data, 0)[0]
                        if magic in (0xFEEDFACF, 0xFEEDFACE):
                            filetype = struct.unpack_from('<I', data, 12)[0]
                            print(f"Mach-O type={filetype}: {path}")
                            if filetype == 13:
                                print(f"  -> スタブDylib削除")
                                os.remove(path)
                except:
                    pass
        PYEOF
    - name: IPAにパッケージ化
      run: |
        mkdir -p Payload
        cp -r "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
        zip -r WebDriverAgent.ipa Payload/
    - name: アーティファクトとしてアップロード
      uses: actions/upload-artifact@v4
      with:
        name: WebDriverAgent
        path: WebDriverAgent.ipa
