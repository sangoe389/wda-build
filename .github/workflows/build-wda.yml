name: Build WDA for AltStore
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    env:
      NEW_BUNDLE_PREFIX: com.i3cow.wda
    steps:
    - name: WebDriverAgentをチェックアウト
      uses: actions/checkout@v4
      with:
        repository: appium/WebDriverAgent
    - name: Xcodeのバージョンを切り替え
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    - name: 依存関係のインストール
      run: brew install xcbeautify
    - name: ビルド
      run: |
        xcodebuild build-for-testing \
          -project WebDriverAgent.xcodeproj \
          -scheme WebDriverAgentRunner \
          -destination "generic/platform=iOS" \
          -derivedDataPath ./DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    - name: Bundle IDを書き換え
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        # 外側の .app
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${NEW_BUNDLE_PREFIX}.xctrunner" "$APP/Info.plist"
        # 内側の .xctest
        XCTEST="$APP/PlugIns/WebDriverAgentRunner.xctest"
        /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${NEW_BUNDLE_PREFIX}" "$XCTEST/Info.plist"
        echo "--- Verify ---"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$XCTEST/Info.plist"
    - name: 全ての署名情報を削除
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        rm -rf "$APP/_CodeSignature"
        rm -f "$APP/embedded.mobileprovision"
        find "$APP/PlugIns" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
        find "$APP/PlugIns" -name "embedded.mobileprovision" -delete 2>/dev/null || true
        if [ -d "$APP/Frameworks" ]; then
          find "$APP/Frameworks" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
        fi
    - name: IPAにパッケージ化
      run: |
        mkdir -p Payload
        cp -r "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
        zip -r WebDriverAgent-AltStore.ipa Payload/
    - name: アーティファクトとしてアップロード
      uses: actions/upload-artifact@v4
      with:
        name: WebDriverAgent-AltStore
        path: WebDriverAgent-AltStore.ipa
