name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - name: WebDriverAgentをチェックアウト
      uses: actions/checkout@v4
      with:
        repository: appium/WebDriverAgent
    - name: Xcodeのバージョンを切り替え
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    - name: 依存関係のインストール
      run: brew install xcbeautify
    - name: ビルド
      run: |
        xcodebuild build-for-testing \
          -project WebDriverAgent.xcodeproj \
          -scheme WebDriverAgentRunner \
          -destination "generic/platform=iOS" \
          -derivedDataPath ./DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    - name: xctest内部バイナリのみad-hoc署名
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        echo "APP: $APP"
        # 全ての既存署名を消す
        rm -rf "$APP/_CodeSignature"
        rm -f "$APP/embedded.mobileprovision"
        find "$APP" -type d -name "_CodeSignature" -exec rm -rf {} + 2>/dev/null || true
        find "$APP" -name "embedded.mobileprovision" -delete 2>/dev/null || true
        # xctest 内部のバイナリだけ ad-hoc 署名（バンドル _CodeSignature は作らない）
        for XCTEST in "$APP"/PlugIns/*.xctest; do
          BIN="$XCTEST/$(basename "$XCTEST" .xctest)"
          echo "Signing binary only: $BIN"
          codesign --force --sign - --timestamp=none "$BIN"
        done
        echo "--- Verify inner binary ---"
        for XCTEST in "$APP"/PlugIns/*.xctest; do
          BIN="$XCTEST/$(basename "$XCTEST" .xctest)"
          codesign -dvv "$BIN" 2>&1 | head -5
        done
    - name: IPAにパッケージ化
      run: |
        mkdir -p Payload
        cp -r "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
        zip -r WebDriverAgent.ipa Payload/
    - name: アーティファクトとしてアップロード
      uses: actions/upload-artifact@v4
      with:
        name: WebDriverAgent
        path: WebDriverAgent.ipa
