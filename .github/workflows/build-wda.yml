name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - name: WebDriverAgentをチェックアウト
      uses: actions/checkout@v4
      with:
        repository: appium/WebDriverAgent
    - name: Xcodeのバージョンを切り替え
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    - name: 依存関係のインストール
      run: brew install xcbeautify
    - name: ビルド
      run: |
        xcodebuild build-for-testing \
          -project WebDriverAgent.xcodeproj \
          -scheme WebDriverAgentRunner \
          -destination "generic/platform=iOS" \
          -derivedDataPath ./DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    - name: xctestバンドルをad-hoc署名
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        echo "APP: $APP"
        # 既存の署名をクリア
        rm -rf "$APP/_CodeSignature"
        find "$APP/PlugIns" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
        # 内側 → 外側 の順に ad-hoc 署名
        for XCTEST in "$APP"/PlugIns/*.xctest; do
          BIN="$XCTEST/$(basename "$XCTEST" .xctest)"
          echo "Signing binary: $BIN"
          codesign --force --sign - --timestamp=none "$BIN"
          echo "Signing bundle: $XCTEST"
          codesign --force --sign - --timestamp=none "$XCTEST"
        done
        # .app 全体を再署名
        codesign --force --sign - --timestamp=none --deep "$APP"
        echo "--- Verify xctest ---"
        codesign -dvv "$APP/PlugIns/WebDriverAgentRunner.xctest"
        echo "--- Verify inner binary ---"
        codesign -dvv "$APP/PlugIns/WebDriverAgentRunner.xctest/WebDriverAgentRunner"
    - name: IPAにパッケージ化
      run: |
        mkdir -p Payload
        cp -r "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
        zip -r WebDriverAgent.ipa Payload/
    - name: アーティファクトとしてアップロード
      uses: actions/upload-artifact@v4
      with:
        name: WebDriverAgent
        path: WebDriverAgent.ipa
