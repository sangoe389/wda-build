name: Build WDA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - name: WebDriverAgentをチェックアウト
      uses: actions/checkout@v4
      with:
        repository: appium/WebDriverAgent
    - name: Xcodeのバージョンを切り替え
      run: sudo xcode-select -s /Applications/Xcode_15.4.app
    - name: 依存関係のインストール
      run: brew install xcbeautify
    - name: ビルド
      run: |
        xcodebuild build-for-testing \
          -project WebDriverAgent.xcodeproj \
          -scheme WebDriverAgentRunner \
          -destination "generic/platform=iOS" \
          -derivedDataPath ./DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
    - name: 署名データを除去
      run: |
        APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
        find "$APP" \( -name "*.dylib" -o -name "*.framework" -o -name "WebDriverAgentRunner-Runner" \) | while read f; do
          codesign --remove-signature "$f" 2>/dev/null || true
        done
    - name: IPAにパッケージ化
      run: |
        mkdir -p Payload
        cp -r "DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
        zip -r WebDriverAgent.ipa Payload/
    - name: アーティファクトとしてアップロード
      uses: actions/upload-artifact@v4
      with:
        name: WebDriverAgent
        path: WebDriverAgent.ipa
